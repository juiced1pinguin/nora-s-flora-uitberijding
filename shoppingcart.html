<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Nora's Flora - Winkelmandje</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <style>
        main {
            background-color: #f6f7e3;
            padding: 40px 20px;
            min-height: 60vh;
        }

        #cartContainer {
            max-width: 900px;
            margin: 0 auto;
            background-color: #d9edb5;
            padding: 30px;
            border-radius: 8px;
            color: #000000;
        }

        #cartContainer h1 {
            text-align: center;
            color: #3f593c;
        }

        #cartItems {
            margin: 20px 0;
        }

        #cartItems table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        #cartItems th,
        #cartItems td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #999;
        }

        #cartItems th {
            background-color: #3f593c;
            color: #ffffff;
        }

        #cartItems button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        #cartItems button:hover {
            background-color: #ff5252;
        }

        .cart-total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #3f593c;
            margin: 20px 0;
        }

        .empty-cart {
            text-align: center;
            color: #3f593c;
            font-size: 18px;
            padding: 40px;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        .cart-actions button {
            background-color: #3f593c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .cart-actions button:hover {
            background-color: #283f25;
        }

        .cart-actions a {
            display: inline-block;
            background-color: #3f593c;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }

        .cart-actions a:hover {
            background-color: #283f25;
        }
    </style>
</head>

<body>
    <header>
        <div id="divLogo">
            <img id="imgLogo" src="images/Nora'sFloraLogo.png" alt="Nora'sFloraLogo" />
        </div>
        <div id="divNavigatie">
            <a href="index.html">| Home |</a>
            <a href="assortiment.html">| Assortiment |</a>
            <a href="contact.html">| Contact |</a>
            <a href="shoppingcart.html">| Winkelmandje |</a>
        </div>
    </header>

    <main>
        <div id="cartContainer">
            <h1>mandje enzo</h1>
            <div id="cartItems"></div>
            <div class="cart-actions">
                <a href="assortiment.html">koop meer plantjes</a>
                <button onclick="clearCart()">Mandje leegmaken</button>
            </div>
        </div>
    </main>

    <footer id="footerContainer">
        <div id="footerLinks">
            <p>
                Email&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: contact@noraflora.com
            </p>
            <p>Telefoon&nbsp;&nbsp;: 06 12345678</p>
            <p>
                Adres&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: Zwolle, pannenkoekendijk
                420 B
            </p>
        </div>
        <div id="footerRechts">
            <h2>Openingstijden</h2>
            <p>Ma - Vr : 12:00 - 17:00</p>
            <p>Zaterdag : 10:00 - 17:00</p>
        </div>
    </footer>

    <script src="producten.js"></script>
    <script>
        function displayCart() {
            const cartContainer = document.getElementById("cartItems");
            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            if (cart.length === 0) {
                cartContainer.innerHTML = '<div class="empty-cart">Je winkelmandje is leeg domme kut. <br><a href="assortiment.html">Ga naar assortiment</a></div>';
                return;
            }

            let cartHTML = "<table><tr><th>Product</th><th>Prijs</th></tr>";
            let total = 0;

            cart.forEach((item, index) => {
                cartHTML += `
                    <tr>
                        <td>${item.naam}</td>
                        <td>€${item.prijs.toFixed(2)}</td>
                     
                    </tr>
                `;
                total += item.prijs;
            });

            cartHTML += `</table><div class="cart-total">Totaal: €${total.toFixed(2)}</div>`;
            cartContainer.innerHTML = cartHTML;
        }

      

        function clearCart() {
            if (confirm("Weet je zeker dat je je winkelmandje wilt leegmaken?")) {
                localStorage.removeItem("cart");
                displayCart();
            }
        }


        displayCart();
    </script>
</body>

</html>
